<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Days Since Last Heat Scrim</title>
</head>

<body>
    <h1>Days since last heat scrim:</h1>
    <h1 id="timer">00:00:00:00</h1>

    <script>
        const start = new Date("2026-09-07T00:00:00").getTime();
        const timeLabel = document.getElementById("timer");

        function updateTimer() {
            const nowEpoch = new Date().getTime();
            let elapsed = nowEpoch - start;

            const days = Math.floor(elapsed / (1000 * 60 * 60 * 24));
            elapsed %= 1000 * 60 * 60 * 24;

            const hours = Math.floor(elapsed / (1000 * 60 * 60));
            elapsed %= 1000 * 60 * 60;

            const minutes = Math.floor(elapsed / (1000 * 60));
            elapsed %= 1000 * 60;

            const seconds = Math.floor(elapsed / 1000);

            timeLabel.textContent =
                `${String(days).padStart(2, "0")}:` +
                `${String(hours).padStart(2, "0")}:` +
                `${String(minutes).padStart(2, "0")}:` +
                `${String(seconds).padStart(2, "0")}`;
        }

        updateTimer();
        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
