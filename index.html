<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Days Since Last Heat Scrim</title>
</head>

<body>
    <h1>Days since last heat scrim:</h1>
    <h1 id="timer">00:00:00:00</h1>
    <h2>dd:hh:mm:ss</h2>
    <img id="repPhoto" src="" style="width: 200px; height: auto;">
    <img id="repPhoto2" src="" style="width: 200px; height: auto;">
    <img id="repPhoto3" src="" style="width: 200px; height: auto;">
    <h3>In that time...</h3>
    <p1 id="deathcount">0 people have died.</p1>
    <p1 id="amazonpkgs">0 amazon packages have been delivered.</p1>
    <h1>MAKE THE SCRIM ALREADY.</h1>
    <p>not vibecoded this time :)</p>

    <script>
        // ooo look at this logic :O
        const start = new Date("2026-09-01T22:17:00").getTime();
        const timeLabel = document.getElementById("timer");
        const graveyardPhoto = "graveyard.jpg";
        const photo = document.getElementById("repPhoto");
        const photo2 = document.getElementById("repPhoto2");
        const photo3 = document.getElementById("repPhoto3");
        function updateTimer() {
            const nowEpoch = new Date().getTime();
            let elapsed = nowEpoch - start;
            let d = Math.floor(elapsed / (1000 * 60 * 60 * 24));
            elapsed %= 1000 * 60 * 60 * 24;
            let h = Math.floor(elapsed / (1000 * 60 * 60));
            elapsed %= 1000 * 60 * 60;
            let m = Math.floor(elapsed / (1000 * 60));
            elapsed %= 1000 * 60;
            let s = Math.floor(elapsed / 1000);
            if (d >= 21 && photo.src != "graveyard.jpg"){
                photo.src = "graveyard.jpg";
                photo2.src = "wasteland.jpg";
                photo3.src = "skeletons.jpg";
            }
            if (d <= 7 && photo.src != thumbsupguy.jpg){
                photo.src = "thumbsupguy.jpg";
                photo2.src = "happyhamster.jpg";
                photo3.src = "thumbsupguy.jpg";
            }
            
            timeLabel.textContent =
                String(d).padStart(2, "0") + ":" +
                String(h).padStart(2, "0") + ":" +
                String(m).padStart(2, "0") + ":" +
                String(s).padStart(2, "0");
        }
        updateTimer();

        function updateStats(){
            let elapsedSecs = ( new Date().getTime() - start ) / 1000;
            const deathct = document.getElementById("deathcount);
            let deaths = elapsedSecs * 2;
            deathct.textContent = deaths + " people have died."
        }
        
        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
